name: Published results and original-file preservation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Preserve original research files
        run: python tools/verify_originals.py
      - name: Check and replay published results
        run: python demo/run_demo.py
      - name: Test result handling
        run: python -m unittest discover -s demo/tests -v
